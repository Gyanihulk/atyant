<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit account — Offline preview</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#153552;font:15px/1.6 system-ui,sans-serif}.access-layout{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;max-width:1440px;margin:auto;align-items:center;gap:70px;padding:70px}.access-brand img{object-fit:contain}.access-brand>p:first-of-type{letter-spacing:2px;font-size:12px;font-weight:700;margin-top:30px}.access-brand h1{font-size:clamp(38px,5vw,66px);line-height:1.1;margin:20px 0}.access-brand h2{font-size:21px;font-weight:500}.access-description{color:#577085;max-width:380px}.access-card{background:#fff;border:1px solid #d6e0e9;border-top:5px solid #173f68;border-radius:16px;padding:36px;box-shadow:0 20px 60px #173f6810}.access-tabs{display:flex;border-bottom:1px solid #d6e0e9;gap:24px}.access-tabs button{background:none;border:0;border-bottom:3px solid transparent;color:#62798c;padding:12px 0;font:600 15px system-ui;cursor:pointer}.access-tabs button[aria-selected=true]{color:#173f68;border-color:#173f68}.access-card h2{font-size:26px;margin-bottom:12px}.setup-note{font-size:12px;padding:12px;background:#fff7df;border-left:3px solid #d5aa35;color:#6d581d}form{display:flex;flex-direction:column;gap:8px}form[hidden]{display:none}label{font-size:13px;font-weight:600;margin-top:12px}input{padding:12px;border:1px solid #c9d6e0;border-radius:6px;min-width:0;font:inherit;width:100%}input:focus,button:focus-visible{outline:2px solid #173f68;outline-offset:3px}.primary{margin-top:22px;padding:14px;background:#173f68;color:#fff;border:0;border-radius:6px;font:600 14px system-ui}.primary:disabled{opacity:.55;cursor:not-allowed}small,.access-footer{font-size:12px;color:#647d90}.access-footer{text-align:center;margin-top:24px}@media(max-width:800px){.access-layout{grid-template-columns:1fr;padding:28px 18px;gap:24px}.access-brand img{width:65px;height:65px}.access-brand h1{margin:12px 0}.access-brand>p:first-of-type{margin-top:14px}.access-card{padding:24px}.access-description{max-width:none}}
.admin-page{max-width:1000px;margin:auto;padding:30px}.admin-page a{color:#173f68;font-weight:600;text-decoration:none}.admin-page h1{margin:14px 0 6px}
.admin-edit-page{width:100%;max-width:580px;margin:0 auto;padding:30px clamp(18px,4vw,30px)}.admin-edit-page>h1{text-align:center;margin:14px 0 20px}.admin-edit-page>.access-card{width:100%}
.admin-table{width:100%;border-collapse:collapse;margin-top:18px;background:#fff;border:1px solid #d6e0e9;border-radius:12px;overflow:hidden}
.admin-table th,.admin-table td{padding:12px 14px;text-align:left;border-bottom:1px solid #e6edf3;font-size:14px}
.admin-table th{background:#f4f8fb;font-size:12px;letter-spacing:.4px;color:#62798c;text-transform:uppercase}
.admin-table tr.is-you{background:#f7fbff}
.admin-table code{background:#eef3f8;padding:2px 6px;border-radius:4px;font-size:13px}
.role-badge,.status-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.role-badge.admin{background:#173f68;color:#fff}.role-badge.employee{background:#e6edf3;color:#3d5872}
.status-badge.approved{background:#e4f3e6;color:#1e7a34}.status-badge.pending{background:#fff7df;color:#8a6a0f}
.status-badge.rejected,.status-badge.disabled{background:#fbe6e6;color:#a3282c}
.admin-edit-link{color:#173f68;font-weight:600;text-decoration:none}
.admin-error{font-size:13px;padding:10px 12px;background:#fbe6e6;border-left:3px solid #a3282c;color:#7a1f22;border-radius:4px}
@media(max-width:700px){.admin-table{display:block;overflow-x:auto;white-space:nowrap}}
</style>
</head>
<body>
<main class="admin-page admin-edit-page">
<a href="#" onclick="return false">← User management</a>
<h1>Edit account</h1>
<section class="access-card">
<p><strong>Admin One</strong><br>Employee ID: <code>ADMIN1</code></p>
<p class="setup-note">Offline layout preview with sample data. Changes are not saved.</p>
<form onsubmit="event.preventDefault();if(this.elements.status.value==='delete' &amp;&amp; !confirm('Permanently delete this account? This cannot be undone.'))return;document.getElementById('previewResult').textContent=this.elements.status.value==='delete'?'Preview only: account deletion confirmed. No account was deleted.':'Preview only: changes are not saved.';">
<label>Access status <select name="status"><option>Pending</option><option selected>Approved</option><option>Rejected</option><option>Disabled</option><option value="delete">Delete account (permanent)</option></select></label>
<label><input type="checkbox" name="admin" checked> Admin role — can approve accounts and manage users</label>
<button class="primary">Save changes</button>
<p id="previewResult" role="status"></p>
</form>
</section>
</main>
</body>
</html>
